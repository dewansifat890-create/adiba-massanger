<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
          var proto = Object.getPrototypeOf(window);
          var protoDesc = proto ? Object.getOwnPropertyDescriptor(proto, 'fetch') : undefined;
          var desc = ownDesc || protoDesc;
          if (desc && desc.get && !desc.set && (!ownDesc || ownDesc.configurable !== false)) {
            var currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (nextFetch) {
                if (typeof nextFetch === 'function') {
                  currentFetch = nextFetch;
                }
              },
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              typeof event.filename === 'string' &&
              event.filename.indexOf('chrome-extension://') === 0
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches && e.touches.length > 1) {
              e.preventDefault();
            }
          },
          { passive: false }
        );
        var lastTouchEnd = 0;
        document.addEventListener(
          'touchend',
          function (e) {
            var now = Date.now();
            if (now - lastTouchEnd <= 300) {
              var tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
              if (tag !== 'input' && tag !== 'textarea' && tag !== 'button') {
                e.preventDefault();
              }
            }
            lastTouchEnd = now;
          },
          { passive: false }
        );
        document.addEventListener(
          'wheel',
          function (e) {
            if (e.ctrlKey) e.preventDefault();
          },
          { passive: false }
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>NotePad — Smart Mobile Notes</title>
    <meta name="description" content="A clean, mobile-first notes app with smart checklists, folders, instant search, and customizable settings." />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NotePad" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta property="og:title" content="NotePad — Smart Mobile Notes" />
    <meta property="og:description" content="A clean, mobile-first notes app with smart checklists, folders, instant search, and customizable settings." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
